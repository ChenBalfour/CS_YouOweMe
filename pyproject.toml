[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-youoweme"
dynamic = ["version"]
description = "CS2 skin market collection and data-mining research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["matplotlib>=3.10,<4"]
research = ["numpy>=1.26,<3", "scikit-learn>=1.4,<2", "statsmodels>=0.14,<1", "lightgbm>=4,<5"]
neural = ["torch>=2.0,<3"]

[project.urls]
Repository = "https://github.com/ChenBalfour/CS_YouOweMe"

[tool.setuptools.packages.find]
where = ["scripts/src"]

[tool.setuptools.dynamic]
version = {attr = "cs_youoweme.__version__"}

[tool.setuptools.package-data]
cs_youoweme = ["history/schema.sql"]

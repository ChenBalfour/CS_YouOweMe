[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cs-youoweme"
dynamic = ["version"]
description = "CS2 skin market collection and data-mining research"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = []

[project.urls]
Repository = "https://github.com/ChenBalfour/CS_YouOweMe"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "cs_youoweme.__version__"}
